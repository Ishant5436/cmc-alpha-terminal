[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-alpha-terminal"
version = "0.1.0"
description = "Institutional-Grade Quantitative Intelligence & FastMCP Agent Terminal Powered by CoinMarketCap Pro API"
readme = "README.md"
authors = [{ name = "Ishant Panchal", email = "ishant.p@somaiya.edu" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["python"]
