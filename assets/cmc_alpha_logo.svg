<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Radial Accent Glow -->
    <radialGradient id="center-glow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4FACFE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Stroke Gradient -->
    <linearGradient id="alpha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Terminal Prompt Gradient -->
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background with rounded squircle -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg-grad)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#center-glow)"/>

  <!-- Subtle Outer Border with Bezel -->
  <rect x="4" y="4" width="1016" height="1016" rx="216" fill="none" stroke="#1E293B" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="8" y="8" width="1008" height="1008" rx="212" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Precision Background Coordinate Grid -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6">
    <!-- Vertical Grid Lines -->
    <line x1="256" y1="140" x2="256" y2="884"/>
    <line x1="512" y1="140" x2="512" y2="884"/>
    <line x1="768" y1="140" x2="768" y2="884"/>
    <!-- Horizontal Grid Lines -->
    <line x1="140" y1="256" x2="884" y2="256"/>
    <line x1="140" y1="512" x2="884" y2="512"/>
    <line x1="140" y1="768" x2="884" y2="768"/>
  </g>

  <!-- Precision Corner Reticles / HUD Accents -->
  <g stroke="#00F2FE" stroke-width="2" stroke-opacity="0.4" fill="none">
    <!-- Top-Left Reticle -->
    <path d="M 180 220 L 180 180 L 220 180"/>
    <!-- Top-Right Reticle -->
    <path d="M 844 220 L 844 180 L 804 180"/>
    <!-- Bottom-Left Reticle -->
    <path d="M 180 804 L 180 844 L 220 844"/>
    <!-- Bottom-Right Reticle -->
    <path d="M 844 804 L 844 844 L 804 844"/>
  </g>

  <!-- Central Ambient Light Ring -->
  <circle cx="512" cy="500" r="260" fill="none" stroke="#0F2038" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="512" cy="500" r="260" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8 12"/>

  <!-- MAIN QUANT MONOGRAM: Geometric Alpha (α) + Terminal Prompt (>_) -->
  <g filter="url(#glow)">
    <!-- The Greek Alpha Loop: Smooth, mathematically continuous parametric bezier curve -->
    <!-- Starting top right (680, 310), sweeping down-left into the loop (380, 500), circling around (500, 620), crossing at (540, 500), and terminating bottom right (720, 680) -->
    <path d="M 690 320 
             C 630 380, 480 430, 390 490 
             C 300 550, 300 660, 390 710 
             C 480 760, 580 700, 620 620 
             C 650 560, 640 450, 540 400
             C 440 350, 330 450, 340 570
             C 350 670, 460 740, 570 720
             C 650 700, 700 640, 740 680" 
          fill="none" 
          stroke="url(#alpha-grad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Terminal Prompt Chevron Bracket '>': Nested precisely inside the left aperture -->
    <path d="M 260 440 L 325 500 L 260 560" 
          fill="none" 
          stroke="url(#prompt-grad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Execution Terminal Cursor '_' Underline at Output -->
    <line x1="710" y1="735" x2="785" y2="735" 
          stroke="#F8FAFC" 
          stroke-width="24" 
          stroke-linecap="round"/>
  </g>

  <!-- Precision Anchor Nodes / High-Impact Accents -->
  <g filter="url(#subtle-glow)">
    <!-- Top-Right Origin Point -->
    <circle cx="690" cy="320" r="12" fill="#00F2FE"/>
    <circle cx="690" cy="320" r="6" fill="#FFFFFF"/>

    <!-- Central Intersection Node -->
    <circle cx="512" cy="500" r="8" fill="#38BDF8"/>

    <!-- Right Terminal Vector Node -->
    <circle cx="740" cy="680" r="10" fill="#818CF8"/>
    <circle cx="740" cy="680" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Subtle Micro-Typography Badge at Base -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="700" letter-spacing="8" fill="#64748B" text-anchor="middle">
    <text x="512" y="885">QUANTITATIVE TERMINAL</text>
  </g>
</svg>